# Keeps the free Render backend from going to sleep (it sleeps after 15 minutes without visitors and then
# takes about a minute to wake up). Calls the health endpoint every 10 minutes. Free for public repositories.
# Note: GitHub may delay scheduled runs by a few minutes when it is busy, and pauses them after 60 days
# without commits to the repository.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health endpoint
        run: curl --silent --show-error --max-time 90 --retry 2 https://trustlens-api-p05f.onrender.com/api/health
